<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Ever, Teddy: The Plan</title>
<style>:root{ --bg:#f7f3ec; --panel:#fffdf8; --ink:#2d2a26; --muted:#6f6a61; --line:#e3dccf; --green:#33473a; --green-soft:#e8ede6; --gold:#b9906a; --rose:#8a4f5c; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI", system-ui, -apple-system, sans-serif; line-height:1.65; }
h1,h2,h3{ font-family:Georgia, "Times New Roman", serif; font-weight:600; line-height:1.15; }
.eyebrow{ text-transform:uppercase; letter-spacing:.14em; font-size:12px; font-weight:700; color:var(--gold); }
.gate{ min-height:100svh; display:grid; place-items:center; padding:20px; }
.gate-card{ background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:36px; max-width:520px; width:100%; box-shadow:0 18px 40px rgba(45,42,38,.08); }
.gate-card h1{ font-size:44px; margin:10px 0; }
.gate-card p{ color:var(--muted); }
.gate-card label{ display:block; font-weight:700; font-size:13px; margin-top:18px; }
.gate-row{ display:flex; gap:8px; margin-top:7px; }
.gate-row input{ flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; background:#fff; }
.gate-row button{ border:1px solid var(--green); background:var(--green); color:#fff; border-radius:10px; padding:11px 16px; font:inherit; font-weight:700; cursor:pointer; white-space:nowrap; }
.error{ color:#9b2c3d !important; font-weight:600; }
.gate-note{ font-size:13px; }
.content{ max-width:920px; margin:0 auto; padding:28px 20px 56px; }
.content section{ background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:28px; margin-bottom:18px; }
.content section.hero{ background:var(--green); color:#f5f1e8; border-color:var(--green); padding:40px 32px; }
.content .hero .eyebrow{ color:#d8c9a8; }
.content .hero h1{ font-size:clamp(44px, 8vw, 72px); margin:8px 0; font-weight:500; }
.lede{ font-size:19px; color:#e7e0d1; max-width:56ch; }
.facts{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:24px; }
.facts div{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); border-radius:14px; padding:14px; }
.facts strong{ display:block; font-family:Georgia, serif; font-size:21px; }
.facts span{ color:#cfd8cd; font-size:13px; }
.content h2{ font-size:27px; margin:0 0 12px; }
.content p{ color:#454139; }
.content section.hero p{ color:#e7e0d1; }
.cards{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:14px; }
.cards article{ border:1px solid var(--line); border-radius:14px; padding:17px; background:#fff; }
.cards h3{ font-size:21px; margin:5px 0 2px; }
.order{ font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:700; }
.role{ color:var(--rose) !important; font-weight:700; margin:0 0 8px; }
.cards p{ font-size:14.5px; }
.timeline, .steps{ list-style:none; padding:0; margin:12px 0 0; display:grid; gap:10px; }
.timeline li{ display:grid; grid-template-columns:130px 1fr; gap:14px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
.timeline li span{ font-weight:700; color:var(--green); font-size:13.5px; padding-top:2px; }
.steps{ counter-reset:step; }
.steps li{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
.questions li, .content ul li{ margin-bottom:7px; }
.closing{ background:#f4efe4 !important; }
.credit{ font-family:Georgia, serif; font-size:16.5px; }
@media (max-width:680px){ .facts, .cards{ grid-template-columns:1fr; } .timeline li{ grid-template-columns:1fr; gap:3px; } .gate-row{ flex-direction:column; } .content section{ padding:22px; } }
</style>
</head>
<body>
<main id="gate" class="gate">
  <div class="gate-card">
    <p class="eyebrow">Private family page</p>
    <h1>Ever, Teddy</h1>
    <p>This page holds the plan for a short memorial film for Teddy Sodeman. Enter the password you were given to read it.</p>
    <form id="gate-form">
      <label for="pw">Password</label>
      <div class="gate-row">
        <input id="pw" type="password" autocomplete="current-password" required />
        <button type="submit">Open the plan</button>
      </div>
      <p id="gate-error" class="error" role="alert" hidden>That password did not work. Check it and try again.</p>
    </form>
    <p class="gate-note">Please do not forward the password. Savannah decides how the finished film is shared.</p>
  </div>
</main>
<main id="content" class="content" hidden></main>

const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: fromB64(PAYLOAD.salt), iterations: 210000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(PAYLOAD.iv) }, key, fromB64(PAYLOAD.data));
  document.getElementById('content').innerHTML = new TextDecoder().decode(plain);
  document.getElementById('gate').hidden = true;
  document.getElementById('content').hidden = false;
  document.title = 'Ever, Teddy: The Plan';
}
document.getElementById('gate-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const password = document.getElementById('pw').value;
  const error = document.getElementById('gate-error');
  try {
    await unlock(password);
    sessionStorage.setItem('ever-teddy-share', password);
  } catch {
    error.hidden = false;
  }
});
const saved = sessionStorage.getItem('ever-teddy-share');
if (saved) { unlock(saved).catch(() => sessionStorage.removeItem('ever-teddy-share')); }
